<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05060A" />
  <meta name="color-scheme" content="dark" />

  <title>Specathon 2026</title>

  <!-- Favicons -->
  <!-- SVG favicon: supported in Chrome, Edge, Firefox, Safari 17+ -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- ICO fallback: Safari <17, legacy Edge, IE -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
  <!-- Apple Touch Icon: iOS home screen -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="description" content="SPECATHON 2026 — a 36-hour hackathon hosted by SPEC. September 11–12, 2026." />
  <link rel="canonical" href="https://specathon.dev/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="SPECATHON 2026 — 24-Hour Hackathon" />
  <meta property="og:description" content="Hosted by SPEC. September 11–12, 2026. Register your team now." />
  <meta property="og:site_name" content="SPECATHON 2026" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SPECATHON 2026" />
  <meta name="twitter:description" content="A 36-hour hackathon hosted by SPEC. " />

  <!-- Google Analytics: only the async external script lives here.
       The gtag() initialisation has been moved to src/analytics.ts
       to eliminate the inline <script> that would require 'unsafe-inline'. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6NTN0DVME7"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
      Non-blocking font load: fetched as a print stylesheet, promoted to
      all media once loaded. The inline onload handler has been replaced
      with the script below to stay CSP-compliant.
  -->
  <link id="google-fonts-css" rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Alegreya+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Sora:wght@400;600;700;800&display=swap" />
  <link id="google-fonts-sheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Alegreya+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Sora:wght@400;600;700;800&display=swap"
    rel="stylesheet" media="print" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Alegreya+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet" />
  </noscript>
  <!-- Promote font stylesheet from print to all once loaded (CSP-safe external script) -->
  <script src="/font-loader.js" defer></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
